<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="풋살 타이머">
  <title>풋살 타이머</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green:  #00e676;
      --yellow: #ffca28;
      --red:    #ff1744;
      --bg:     #090909;
      --panel:  #111827;
      --surf:   #1f2937;
      --dim:    #6b7280;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }


    /* ── Flash overlay ── */
    #flash { position: fixed; inset: 0; pointer-events: none; z-index: 200; opacity: 0; }
    @keyframes do-flash {
      0%,100%  { opacity: 0; }
      20%,60%  { opacity: .88; }
      40%,80%  { opacity: 0; }
    }
    #flash.flash-red   { background: #ff1744; animation: do-flash 1s ease; }
    #flash.flash-green { background: #00e676; animation: do-flash 1s ease; }
    #flash.flash-white { background: #ffffff; animation: do-flash .7s ease; }

    /* ── End overlay ── */
    #end-overlay {
      position: fixed; inset: 0; z-index: 150;
      background: rgba(0,0,0,.92);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      opacity: 0; pointer-events: none; transition: opacity .4s;
    }
    #end-overlay.show { opacity: 1; pointer-events: all; }
    .end-trophy  { font-size: 64px; }
    .end-info    { display: flex; flex-direction: column; gap: 6px; text-align: center; }
    .end-title   { font-size: 26px; font-weight: 900; letter-spacing: 2px; }
    .end-sub     { color: var(--dim); font-size: 14px; }
    .end-summary { color: var(--dim); font-size: 13px; }
    .btn-new {
      padding: 14px 30px;
      background: var(--green); color: #000;
      border: none; border-radius: 14px;
      font-size: 16px; font-weight: 800; cursor: pointer;
    }
    .btn-new:active { opacity: .8; }
    .btn-back-end {
      background: none; border: none; color: var(--dim);
      font-size: 14px; cursor: pointer; padding: 8px 16px;
      text-decoration: underline; text-underline-offset: 3px;
    }

    /* ── Confirm dialog ── */
    #confirm-overlay {
      position: fixed; inset: 0; z-index: 180;
      background: rgba(0,0,0,.78);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    #confirm-overlay.show { opacity: 1; pointer-events: all; }
    .confirm-box {
      background: var(--panel); border-radius: 20px;
      padding: 28px 28px 22px;
      width: min(320px, 88vw);
      display: flex; flex-direction: column; gap: 10px;
      text-align: center;
      transform: scale(.92); transition: transform .2s;
    }
    #confirm-overlay.show .confirm-box { transform: scale(1); }
    .confirm-icon  { font-size: 32px; }
    .confirm-title { font-size: 17px; font-weight: 800; }
    .confirm-sub   { font-size: 12px; color: var(--dim); margin-bottom: 4px; }
    .confirm-btns  { display: flex; gap: 10px; }
    .confirm-cancel, .confirm-ok {
      flex: 1; padding: 13px;
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .confirm-cancel { background: var(--surf); color: #9ca3af; }
    .confirm-ok     { background: var(--red);  color: #fff; }
    .confirm-cancel:active, .confirm-ok:active { opacity: .78; }

    /* ── Alarm popup (경기 종료 경보 — 확인 전까지 유지) ── */
    #alarm-overlay {
      position: fixed; inset: 0; z-index: 190;
      background: rgba(0,0,0,.85);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    #alarm-overlay.show { opacity: 1; pointer-events: all; }
    .alarm-box {
      background: var(--panel); border: 2px solid var(--red); border-radius: 20px;
      padding: 32px 28px 24px;
      width: min(340px, 88vw);
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      text-align: center;
      animation: alarm-pulse 1s ease-in-out infinite;
    }
    @keyframes alarm-pulse {
      0%, 100% { box-shadow: 0 0 0 rgba(255,23,68,.5); }
      50%      { box-shadow: 0 0 28px rgba(255,23,68,.7); }
    }
    .alarm-icon  { font-size: 40px; }
    .alarm-title { font-size: 19px; font-weight: 900; color: var(--red); }
    .alarm-sub   { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
    .alarm-btn {
      width: 100%; padding: 15px;
      background: var(--red); color: #fff;
      border: none; border-radius: 12px;
      font-size: 16px; font-weight: 800; cursor: pointer;
    }
    .alarm-btn:active { opacity: .8; }

    /* 자동 진행 모드용 — 화면을 가리지 않는 상단 배너 (숫자가 계속 보여야 하니까) */
    #alarm-banner {
      position: fixed; top: calc(54px + env(safe-area-inset-top, 0px) + 10px);
      left: 50%; transform: translateX(-50%) translateY(-16px);
      z-index: 190;
      background: var(--panel); border: 2px solid var(--red); border-radius: 14px;
      padding: 9px 10px 9px 16px;
      display: flex; align-items: center; gap: 12px;
      opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s;
      animation: alarm-pulse 1s ease-in-out infinite;
    }
    #alarm-banner.show { opacity: 1; pointer-events: all; transform: translateX(-50%) translateY(0); }
    .alarm-banner-text { font-size: 13px; font-weight: 800; color: #fff; white-space: nowrap; }
    .alarm-banner-btn {
      padding: 7px 16px;
      background: var(--red); color: #fff;
      border: none; border-radius: 9px;
      font-size: 13px; font-weight: 800; cursor: pointer;
      flex-shrink: 0;
    }
    .alarm-banner-btn:active { opacity: .8; }

    /* ── Settings sheet ── */
    .settings-backdrop {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.7);
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    .settings-backdrop.open { opacity: 1; pointer-events: all; }

    .settings-sheet {
      position: fixed; bottom: 0; left: 50%; z-index: 101;
      transform: translateX(-50%) translateY(100%);
      background: var(--panel);
      border-radius: 22px 22px 0 0;
      padding: 10px calc(22px + env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) calc(22px + env(safe-area-inset-left, 0px));
      width: 100%; max-width: 600px;
      transition: transform .35s cubic-bezier(.32,.72,0,1);
      max-height: 90vh; overflow-y: auto;
    }
    .settings-sheet.open { transform: translateX(-50%) translateY(0); }

    .sheet-handle {
      width: 36px; height: 4px; background: #374151; border-radius: 2px;
      margin: 0 auto 16px;
    }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .sheet-title { font-size: 16px; font-weight: 800; }

    .btn-apply-sm {
      padding: 8px 18px;
      background: var(--green); color: #000;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 800; cursor: pointer;
      flex-shrink: 0;
    }
    .btn-apply-sm:active { opacity: .8; }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      column-gap: 20px;
    }
    .setting-row {
      display: flex; align-items: center;
      justify-content: space-between; gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #1f2937;
    }
    .setting-row.span2 { grid-column: 1 / -1; }
    .setting-info .s-name { font-size: 14px; font-weight: 600; }
    .setting-info .s-desc { font-size: 11px; color: var(--dim); margin-top: 1px; }
    .settings-note {
      font-size: 11px; color: var(--dim);
      text-align: center; margin-top: 14px;
    }

    .stepper {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg); border-radius: 10px; padding: 5px 8px;
      flex-shrink: 0;
    }
    .stepper button {
      width: 40px; height: 40px;
      background: var(--surf); border: none; color: #fff;
      border-radius: 9px; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .stepper button:active { background: #374151; }
    .stepper-val {
      min-width: 34px; text-align: center;
      font-size: 18px; font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .toggle { position: relative; width: 46px; height: 25px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute; inset: 0;
      background: #374151; border-radius: 25px;
      cursor: pointer; transition: background .25s;
    }
    .toggle-track::before {
      content: ''; position: absolute;
      width: 19px; height: 19px; top: 3px; left: 3px;
      background: #fff; border-radius: 50%; transition: transform .25s;
    }
    .toggle input:checked ~ .toggle-track { background: var(--green); }
    .toggle input:checked ~ .toggle-track::before { transform: translateX(21px); }


    /* ══════════════════════════════════════
       MAIN LANDSCAPE SCREEN
    ══════════════════════════════════════ */
    .screen {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows:
        calc(54px + env(safe-area-inset-top, 0px))
        1fr
        calc(58px + env(safe-area-inset-bottom, 0px));
    }

    /* ── Top bar ── */
    .top-bar {
      display: flex; align-items: flex-start;
      padding: calc(env(safe-area-inset-top, 0px) + 18px) calc(14px + env(safe-area-inset-right, 0px)) 0 calc(14px + env(safe-area-inset-left, 0px));
      gap: 12px;
    }
    .app-name {
      align-self: center;
      font-size: 13px; font-weight: 700;
      letter-spacing: 3px; color: var(--dim);
      text-transform: uppercase; flex-shrink: 0;
    }
    .period-track {
      align-self: center;
      flex: 1; height: 34px;
      display: flex; align-items: center; gap: 6px;
      overflow: hidden;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #2d3748; flex-shrink: 0;
      transition: background .3s, box-shadow .3s;
    }
    .dot.active { background: var(--green); box-shadow: 0 0 7px var(--green); }
    .dot.done   { background: #374151; }
    .period-text {
      font-size: 12px; font-weight: 700; color: var(--dim);
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .btn-settings {
      background: var(--surf); border: none; color: #9ca3af;
      width: 34px; height: 34px; border-radius: 9px;
      font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .btn-settings:active { background: #374151; }

    /* ── Timer center ── */
    .timer-wrap {
      grid-row: 2;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2px; overflow: hidden;
      padding: 0 8px;
    }

    .mode-badge {
      font-size: 24px; font-weight: 800;
      letter-spacing: 3px; text-transform: uppercase;
      color: var(--green); transition: color .3s;
      min-height: 28px;
    }
    .mode-badge.brk { color: var(--yellow); }

    /* THE BIG NUMBER — fills available vertical space */
    .timer-digits {
      font-size: min(50dvh, 28vw);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      font-family: 'Courier New', monospace;
      letter-spacing: -3px;
      line-height: 1;
      color: #fff;
      transition: color .2s, text-shadow .2s;
    }
    .timer-digits.warn {
      color: var(--red);
      text-shadow: 0 0 50px rgba(255,23,68,.55);
      animation: beat .85s ease-in-out infinite;
    }
    @keyframes beat {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.018); }
    }

    .status-row {
      display: flex; flex-wrap: wrap;
      gap: 4px 12px; align-items: baseline; justify-content: center;
      font-size: 17px; color: var(--dim); min-height: 22px;
      text-align: center; line-height: 1;
    }
    .s-period, .s-finish-row { white-space: nowrap; line-height: 1; }
    .s-period { font-weight: 600; color: var(--green); transition: color .3s; }
    .status-row.brk .s-period { color: var(--yellow); }
    .s-finish-time { font-weight: 700; color: #9ca3af; }

    .s-next-row {
      font-size: 17px; color: var(--dim);
      text-align: center; margin-top: 2px;
    }

    .match-finish-corner {
      position: fixed;
      top: calc(54px + env(safe-area-inset-top, 0px) + 6px);
      left: calc(14px + env(safe-area-inset-left, 0px));
      z-index: 10;
    }
    .mfc-label { font-size: 12px; color: var(--dim); }
    .mfc-time  { font-size: 20px; color: #9ca3af; font-weight: 700; margin-top: 1px; }

    /* ── Bottom controls ── */
    .bottom-bar {
      display: flex; align-items: flex-start;
      padding: 8px calc(14px + env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) calc(14px + env(safe-area-inset-left, 0px));
      gap: 10px;
    }
    .btn-reset {
      height: 42px; padding: 0 18px;
      background: var(--surf); color: #9ca3af;
      border: none; border-radius: 11px;
      font-size: 19px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .btn-reset:active { background: #374151; }
    .btn-reset:disabled { opacity: .35; pointer-events: none; }
    .btn-main {
      flex: 1; height: 42px;
      border: none; border-radius: 11px;
      font-size: 16px; font-weight: 800; cursor: pointer;
      background: var(--green); color: #000;
      transition: background .3s;
      letter-spacing: .5px;
    }
    .btn-main.brk  { background: var(--yellow); }
    .btn-main:active { opacity: .75; }

    .btn-skip {
      height: 42px; padding: 0 18px;
      background: var(--surf); color: #9ca3af;
      border: none; border-radius: 11px;
      font-size: 17px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .btn-skip:active { background: #374151; }
    .btn-skip.hidden { display: none; }

    /* ── Focus mode (풀스크린 큰 숫자) ── */
    .focus-tap-catcher { display: none; }
    body.focus-mode .focus-tap-catcher {
      display: block; position: fixed; inset: 0; z-index: 5;
    }

    body.focus-mode .top-bar,
    body.focus-mode .status-row,
    body.focus-mode .s-next-row,
    body.focus-mode .match-finish-corner {
      display: none;
    }
    body.focus-mode .mode-badge { font-size: 28px; }
    body.focus-mode .screen { grid-template-rows: 0 1fr 0; }
    body.focus-mode .timer-digits { font-size: min(85vh, 32vw); }

    body.focus-mode .bottom-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      background: rgba(0,0,0,.75);
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    body.focus-mode .bottom-bar.peek { opacity: 1; pointer-events: all; }
  </style>
</head>
<body>


<!-- Flash -->
<div id="flash"></div>

<!-- 전체 경기 종료 시각 (상단 왼쪽 코너) -->
<div class="match-finish-corner" id="match-finish-corner">
  <div class="mfc-label">전체 경기 종료 시간</div>
  <div class="mfc-time" id="mfc-time"></div>
</div>

<!-- End overlay -->
<div id="end-overlay">
  <div class="end-trophy">🏆</div>
  <div class="end-info">
    <div class="end-title">경기 종료</div>
    <div class="end-sub">수고하셨습니다!</div>
    <div class="end-summary" id="end-summary"></div>
  </div>
  <button class="btn-new" onclick="resetAll()">새 경기 시작</button>
  <button class="btn-back-end" onclick="backFromEnd()">↩ 되돌리기</button>
</div>

<!-- Confirm reset -->
<div id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-icon" id="confirm-icon-el">↺</div>
    <div class="confirm-title" id="confirm-title-el">초기화 하시겠습니까?</div>
    <div class="confirm-sub" id="confirm-sub-el">진행 중인 경기가 모두 초기화됩니다</div>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="closeConfirm()">취소</button>
      <button class="confirm-ok"     onclick="doConfirm()" id="confirm-ok-btn">확인</button>
    </div>
  </div>
</div>

<!-- 경기 종료 경보 (확인 전까지 유지) -->
<div id="alarm-overlay">
  <div class="alarm-box">
    <div class="alarm-icon">⏱</div>
    <div class="alarm-title" id="alarm-title-text">경기 종료</div>
    <div class="alarm-sub">버튼을 눌러 다음 단계를 시작하세요</div>
    <button class="alarm-btn" id="alarm-btn">확인</button>
  </div>
</div>

<!-- 경기 종료 경보 (자동 진행 모드 — 숫자를 가리지 않는 배너) -->
<div id="alarm-banner">
  <div class="alarm-banner-text">⏱ 경기 종료</div>
  <button class="alarm-banner-btn" id="alarm-banner-btn">확인</button>
</div>

<!-- Settings -->
<div class="settings-backdrop" id="settings-backdrop" onclick="closeSettings()"></div>
<div class="settings-sheet"   id="settings-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">타이머 설정</div>
    <button class="btn-apply-sm" onclick="applySettings()">적용</button>
  </div>
  <div class="settings-grid">

    <div class="setting-row">
      <div class="setting-info">
        <div class="s-name">경기 시간</div>
        <div class="s-desc">분 단위</div>
      </div>
      <div class="stepper">
        <button onclick="adj('game',-1)">−</button>
        <div class="stepper-val" id="val-game">20</div>
        <button onclick="adj('game',+1)">＋</button>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-info">
        <div class="s-name">쉬는 시간</div>
        <div class="s-desc">분 단위</div>
      </div>
      <div class="stepper">
        <button onclick="adj('brk',-1)">−</button>
        <div class="stepper-val" id="val-brk">5</div>
        <button onclick="adj('brk',+1)">＋</button>
      </div>
    </div>

    <div class="setting-row span2">
      <div class="setting-info">
        <div class="s-name">경기 수</div>
        <div class="s-desc">전반·후반 등, 제한 없음</div>
      </div>
      <div class="stepper">
        <button onclick="adj('periods',-1)">−</button>
        <div class="stepper-val" id="val-periods">2</div>
        <button onclick="adj('periods',+1)">＋</button>
      </div>
    </div>

    <div class="setting-row span2">
      <div class="setting-info">
        <div class="s-name">자동 진행</div>
        <div class="s-desc">경기↔쉬는시간 자동 전환 (다음부터 적용)</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="toggle-auto" checked>
        <div class="toggle-track"></div>
      </label>
    </div>

    <div class="setting-row">
      <div class="setting-info">
        <div class="s-name">소리</div>
        <div class="s-desc">종료 신호음</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="toggle-sound" checked>
        <div class="toggle-track"></div>
      </label>
    </div>

    <div class="setting-row">
      <div class="setting-info">
        <div class="s-name">진동</div>
        <div class="s-desc">종료 진동</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="toggle-vibration" checked>
        <div class="toggle-track"></div>
      </label>
    </div>

    <div class="setting-row span2">
      <div class="setting-info">
        <div class="s-name">소리 테스트</div>
        <div class="s-desc">경기 종료음을 미리 들어보세요</div>
      </div>
      <button class="btn-apply-sm" onclick="testSound()">▶ 재생</button>
    </div>

  </div>
  <div class="settings-note">※ 시간·경기 수 변경은 다음 경기/쉬는시간부터 반영됩니다</div>
</div>

<!-- MAIN SCREEN -->
<div class="screen">

  <div class="top-bar">
    <div class="app-name">⚽ Futsal</div>
    <div class="period-track" id="period-track"></div>
    <button class="btn-settings" onclick="openSettings()">⚙</button>
  </div>

  <div class="timer-wrap">
    <div class="mode-badge" id="mode-badge"></div>
    <div class="timer-digits" id="timer-digits">20:00</div>
    <div class="status-row" id="status-row">
      <span class="s-period" id="s-period">경기 준비</span>
      <span class="s-finish-row" id="s-finish-row">이번 구간 종료 <span class="s-finish-time" id="s-finish-time"></span></span>
    </div>
    <div class="s-next-row" id="s-next-row"><span id="s-next"></span></div>
  </div>

  <div class="focus-tap-catcher" id="focus-tap-catcher" onclick="handleFocusTap()"></div>

  <div class="bottom-bar">
    <button class="btn-reset" onclick="handleReset()" id="reset-btn">↺</button>
    <button class="btn-skip hidden" onclick="handlePrev()" id="prev-btn">⏮</button>
    <button class="btn-main"  onclick="handleMain()" id="main-btn">시작</button>
    <button class="btn-skip hidden" onclick="handleSkip()" id="skip-btn">⏭</button>
    <button class="btn-skip" onclick="toggleFocusMode()" id="focus-toggle-btn">⛶</button>
  </div>

</div>

<script>
// ── Config ────────────────────────────────────────────────
let cfg = { gameMin: 20, brkMin: 5, periods: 2, autoBreak: true, soundOn: true, vibrationOn: true };
function loadCfg() {
  try { cfg = { ...cfg, ...JSON.parse(localStorage.getItem('futsal-cfg') || '{}') }; } catch(e) {}
}
function saveCfg() { localStorage.setItem('futsal-cfg', JSON.stringify(cfg)); }

// ── State ─────────────────────────────────────────────────
// mode: idle | game | wait-brk | brk | wait-game | done
let st = { mode: 'idle', period: 1, timeLeft: 0, running: false, tid: null, alarmPending: false };
let transitionTid = null; // 경기/쉬는시간 전환 애니메이션 1.1초 잠금
let matchStartTime = 0;   // 첫 경기 시작 시각(진행 시간 요약용)

// ── Audio ─────────────────────────────────────────────────
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function beepRaw(freq, dur, vol, type, delay) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.connect(g); g.connect(actx.destination);
  o.type = type || 'square'; o.frequency.value = freq;
  const t = actx.currentTime + (delay || 0);
  g.gain.setValueAtTime(vol || 1, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}
function beep(freq, dur, vol, type, delay) {
  if (!cfg.soundOn) return;
  beepRaw(freq, dur, vol, type, delay);
}
// 감쇠 없이 끝까지 최대 음량 유지 (경보용) — 클릭 방지용 짧은 어택/릴리즈만 적용
function beepRawSustain(freq, dur, vol, type, delay) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.connect(g); g.connect(actx.destination);
  o.type = type || 'square'; o.frequency.value = freq;
  const t = actx.currentTime + (delay || 0);
  const ramp = 0.005;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol || 1, t + ramp);
  g.gain.setValueAtTime(vol || 1, t + dur - ramp);
  g.gain.linearRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}
function beepSustain(freq, dur, vol, type, delay) {
  if (!cfg.soundOn) return;
  beepRawSustain(freq, dur, vol, type, delay);
}
// 쉬는시간 종료: "도-미-솔" 3음 상승 (경쾌한 재개 신호)
function soundBrkEnd() {
  beep(523, .18, .7, 'sine', 0);
  beep(659, .18, .7, 'sine', .22);
  beep(784, .4,  .7, 'sine', .44);
}
// 마지막 10초: 1초마다 짧은 틱
function soundWarn() { beep(440, .07, .4, 'sine'); }

// ── 경기 종료 경보 (확인 전까지 반복, 최대 30초 후 자동 중단) ──
let alarmLoopId = null;
let alarmRepeatCount = 0;
const ALARM_MAX_REPEATS = 18; // 약 1.6초 * 18회 ≈ 29초

function playAlarmBurst() {
  beepSustain(2000, .10, 1, 'square', 0);
  beepSustain(2000, .10, 1, 'square', .15);
  beepSustain(2000, .10, 1, 'square', .30);
  beepSustain(2000, .15, 1, 'square', .45);
}

function startAlarmLoop() {
  stopAlarmLoop();
  alarmRepeatCount = 0;
  const tick = () => {
    if (alarmRepeatCount >= ALARM_MAX_REPEATS) { alarmLoopId = null; return; }
    playAlarmBurst();
    alarmRepeatCount++;
    alarmLoopId = setTimeout(tick, 1600);
  };
  tick();
}

function stopAlarmLoop() {
  if (alarmLoopId) clearTimeout(alarmLoopId);
  alarmLoopId = null;
}

function clearAlarm() {
  st.alarmPending = false;
  stopAlarmLoop();
}

function dismissAlarm() {
  clearAlarm();
  render();
}

// ── Flash ─────────────────────────────────────────────────
function flash(type) {
  const el = document.getElementById('flash');
  el.className = '';
  void el.offsetWidth;
  el.className = 'flash-' + type;
  el.addEventListener('animationend', () => el.className = '', { once: true });
}

// ── Vibrate ───────────────────────────────────────────────
const vibe = p => cfg.vibrationOn && navigator.vibrate && navigator.vibrate(p);

// ── Helpers ───────────────────────────────────────────────
const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

const PNAMES = ['전반','후반','3경기','4경기','5경기','6경기','7경기','8경기','9경기','10경기'];
const pname = n => cfg.periods === 1 ? '경기' : (PNAMES[n-1] || `${n}경기`);
const fmtClock = ms => {
  const d = new Date(ms);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
};

// 남은 전체 시간을 추정해 "예상 종료 시각"을 계산한다 (어디까지나 추정치)
function estimatedFinishMs() {
  if (st.mode === 'done') return 0;
  const gameSec = cfg.gameMin * 60;
  const brkSec  = cfg.brkMin * 60;
  let remainingSec;
  if (st.mode === 'idle') {
    remainingSec = cfg.periods * gameSec + Math.max(0, cfg.periods - 1) * brkSec;
  } else if (st.mode === 'game') {
    remainingSec = st.timeLeft + (cfg.periods - st.period) * (brkSec + gameSec);
  } else if (st.mode === 'brk' || st.mode === 'wait-brk') {
    remainingSec = st.timeLeft + (cfg.periods - st.period) * gameSec + Math.max(0, cfg.periods - st.period - 1) * brkSec;
  } else if (st.mode === 'wait-game') {
    remainingSec = st.timeLeft + Math.max(0, cfg.periods - st.period - 1) * (gameSec + brkSec);
  } else {
    remainingSec = 0;
  }
  return Date.now() + remainingSec * 1000;
}

// ── Render ────────────────────────────────────────────────
function render() {
  const digits  = document.getElementById('timer-digits');
  const badge   = document.getElementById('mode-badge');
  const mainBtn = document.getElementById('main-btn');
  const sRow    = document.getElementById('status-row');
  const sPeriod = document.getElementById('s-period');
  const sNext   = document.getElementById('s-next');

  digits.textContent = fmt(st.timeLeft);
  const warn = st.running && st.timeLeft <= 10 && st.timeLeft > 0;
  digits.className = 'timer-digits' + (warn ? ' warn' : '');

  switch (st.mode) {
    case 'idle':
      badge.textContent = ''; badge.className = 'mode-badge';
      sRow.className = 'status-row';
      sPeriod.textContent = '경기 준비';
      sNext.textContent = `${cfg.gameMin}분 · 쉬는시간 ${cfg.brkMin}분`;
      mainBtn.textContent = '시작'; mainBtn.className = 'btn-main';
      break;

    case 'game':
      badge.textContent = '경기중'; badge.className = 'mode-badge';
      sRow.className = 'status-row';
      sPeriod.textContent = `${st.period} / ${cfg.periods}경기`;
      sNext.textContent = st.period < cfg.periods ? `다음: 쉬는시간 ${cfg.brkMin}분` : '마지막 경기';
      mainBtn.textContent = st.running ? '일시정지 ⏸' : (st.timeLeft === cfg.gameMin * 60 ? '시작' : '재개 ▶');
      mainBtn.className = 'btn-main';
      break;

    case 'wait-brk':
      badge.textContent = '경기 종료'; badge.className = 'mode-badge';
      sRow.className = 'status-row';
      sPeriod.textContent = `${pname(st.period)} 종료`;
      sNext.textContent = '버튼을 눌러 쉬는시간 시작';
      mainBtn.textContent = `쉬는시간 시작 (${cfg.brkMin}분)`;
      mainBtn.className = 'btn-main';
      break;

    case 'brk':
      badge.textContent = '쉬는시간'; badge.className = 'mode-badge brk';
      sRow.className = 'status-row brk';
      sPeriod.textContent = `${st.period + 1}경기 준비 중`;
      sNext.textContent = `다음: 경기시간 ${cfg.gameMin}분`;
      mainBtn.textContent = st.running ? '일시정지 ⏸' : '재개 ▶';
      mainBtn.className = 'btn-main brk';
      break;

    case 'wait-game':
      badge.textContent = '쉬는시간 종료'; badge.className = 'mode-badge brk';
      sRow.className = 'status-row brk';
      sPeriod.textContent = `${st.period + 1}경기 준비`;
      sNext.textContent = '버튼을 눌러 경기 시작';
      mainBtn.textContent = `${st.period + 1}경기 시작 (${cfg.gameMin}분)`;
      mainBtn.className = 'btn-main';
      break;
  }

  const prevVisible = ['game', 'brk', 'wait-brk', 'wait-game'].includes(st.mode);
  const skipVisible = ['game', 'brk', 'wait-brk', 'wait-game'].includes(st.mode);
  document.getElementById('prev-btn').classList.toggle('hidden', !prevVisible);
  document.getElementById('skip-btn').classList.toggle('hidden', !skipVisible);
  document.getElementById('reset-btn').disabled = (st.mode === 'idle');
  document.getElementById('s-next-row').style.display = (st.mode !== 'done') ? '' : 'none';

  document.getElementById('s-finish-row').style.display = (st.mode !== 'done') ? '' : 'none';
  if (st.mode !== 'done') {
    document.getElementById('s-finish-time').textContent = fmtClock(Date.now() + st.timeLeft * 1000);
  }

  const finishMs = estimatedFinishMs();
  const matchFinishEl = document.getElementById('match-finish-corner');
  matchFinishEl.style.display = (st.mode !== 'done' && finishMs) ? '' : 'none';
  if (st.mode !== 'done' && finishMs) document.getElementById('mfc-time').textContent = fmtClock(finishMs);

  renderAlarm();
  renderTrack();
}

// 경기/쉬는시간 종료 경보
// - 대기 상태(wait-brk/wait-game, 수동 모드): 항상 가운데 팝업으로 통일, 버튼 = 다음 단계 시작
//   (탭하면 알람도 같이 꺼짐 — executePrev/executeSkip 대신 beginBrk 쪽에서 clearAlarm 처리)
// - 자동 진행 중인데 경기종료 알람이 아직 안 꺼진 경우: 숫자를 가리지 않는 상단 배너, 버튼 = 확인(알람만 끔)
// mode==='game'인 동안(전환 애니메이션 1.1초)은 아직 최종 상태가 아니라서 배너를 일부러 숨겨둠
function renderAlarm() {
  const overlay = document.getElementById('alarm-overlay');
  const banner = document.getElementById('alarm-banner');
  const isWaitState = st.mode === 'wait-brk' || st.mode === 'wait-game';

  if (isWaitState) {
    banner.classList.remove('show');
    document.getElementById('alarm-title-text').textContent = st.mode === 'wait-brk' ? '경기 종료' : '쉬는시간 종료';
    const btn = document.getElementById('alarm-btn');
    btn.textContent = document.getElementById('main-btn').textContent;
    btn.onclick = () => handleMain();
    overlay.classList.add('show');
  } else {
    overlay.classList.remove('show');
  }

  const showBanner = st.alarmPending && !isWaitState && st.mode !== 'done' && st.mode !== 'game';
  if (showBanner) {
    document.getElementById('alarm-banner-btn').onclick = () => dismissAlarm();
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

function showEndSummary() {
  const mins = matchStartTime ? Math.round((Date.now() - matchStartTime) / 60000) : 0;
  document.getElementById('end-summary').textContent = `총 ${mins}분 진행 · ${cfg.periods}경기`;
}

function renderTrack() {
  const wrap = document.getElementById('period-track');
  wrap.innerHTML = '';

  if (cfg.periods <= 12) {
    for (let i = 1; i <= cfg.periods; i++) {
      const d = document.createElement('div');
      d.className = 'dot'
        + (i < st.period ? ' done' : '')
        + (i === st.period && st.mode !== 'idle' ? ' active' : '');
      wrap.appendChild(d);
    }
  } else {
    // Many periods: show text
    const txt = document.createElement('span');
    txt.className = 'period-text';
    txt.textContent = st.mode === 'idle'
      ? `총 ${cfg.periods}경기`
      : `${st.period} / ${cfg.periods}`;
    wrap.appendChild(txt);
  }
}

// ── Timer core ────────────────────────────────────────────
let endTime = 0;

function startTick() {
  clearInterval(st.tid);
  endTime = Date.now() + st.timeLeft * 1000;
  st.tid = setInterval(tick, 200);
}

function tick() {
  const remaining = Math.ceil((endTime - Date.now()) / 1000);
  if (remaining <= 0 && st.timeLeft > 0) {
    st.timeLeft = 0;
    onExpire();
  } else if (remaining !== st.timeLeft) {
    const prev = st.timeLeft;
    st.timeLeft = remaining;
    if (st.timeLeft <= 10 && st.timeLeft > 0 && st.timeLeft < prev) soundWarn();
    render();
  }
}

function onExpire() {
  clearInterval(st.tid);
  st.running = false;

  if (st.mode === 'game') {
    flash('red'); vibe([300,100,300,100,500]);
    st.alarmPending = true;
    startAlarmLoop();
    render();
    const last = st.period >= cfg.periods;
    if (last) {
      releaseWakeLock();
      transitionTid = setTimeout(() => {
        transitionTid = null;
        st.mode = 'done';
        showEndSummary();
        document.getElementById('end-overlay').classList.add('show');
      }, 1100);
    } else if (cfg.autoBreak) {
      transitionTid = setTimeout(() => { transitionTid = null; beginBrk(); }, 1100);
    } else {
      transitionTid = setTimeout(() => {
        transitionTid = null;
        st.mode = 'wait-brk';
        st.timeLeft = cfg.brkMin * 60;
        render();
      }, 1100);
    }
  } else if (st.mode === 'brk') {
    soundBrkEnd(); flash('green'); vibe([100,60,100]);
    render();
    if (cfg.autoBreak) {
      transitionTid = setTimeout(() => { transitionTid = null; beginGame(st.period + 1); }, 1100);
    } else {
      transitionTid = setTimeout(() => {
        transitionTid = null;
        st.mode = 'wait-game';
        st.timeLeft = cfg.gameMin * 60;
        render();
      }, 1100);
    }
  }
}

function beginGame(period) {
  clearAlarm();
  st.mode = 'game'; st.period = period;
  st.timeLeft = cfg.gameMin * 60;
  st.running = true; startTick(); render();
  requestWakeLock();
}

function beginBrk() {
  st.mode = 'brk';
  st.timeLeft = cfg.brkMin * 60;
  st.running = true; startTick(); render();
  requestWakeLock();
}

// ── Button handlers ───────────────────────────────────────
function handleMain() {
  initAudio();
  if (st.mode === 'idle')      { matchStartTime = Date.now(); beginGame(1); return; }
  if (st.mode === 'wait-brk') { clearAlarm(); beginBrk();  return; }
  if (st.mode === 'wait-game') { beginGame(st.period + 1); return; }
  if (st.running) { clearInterval(st.tid); st.running = false; }
  else            { st.running = true; startTick(); }
  render();
}

function handlePrev() {
  if (transitionTid !== null) return;
  if (st.mode === 'idle') return;
  initAudio();
  showConfirm('⏮', '이전 단계로 이동할까요?', '현재 진행 상황은 초기화됩니다', '이동', executePrev);
}

function executePrev() {
  clearAlarm();
  clearInterval(st.tid); st.running = false;
  if (st.mode === 'game') {
    if (st.period === 1) {
      st = { mode: 'idle', period: 1, timeLeft: cfg.gameMin * 60, running: false, tid: null, alarmPending: false };
      matchStartTime = 0;
      releaseWakeLock(); render();
    } else {
      st.period -= 1;
      if (cfg.autoBreak) { beginBrk(); }
      else { st.mode = 'wait-brk'; st.timeLeft = cfg.brkMin * 60; render(); }
    }
  } else if (st.mode === 'brk' || st.mode === 'wait-brk') {
    if (cfg.autoBreak) { beginGame(st.period); }
    else { st.mode = 'game'; st.timeLeft = cfg.gameMin * 60; render(); }
  } else if (st.mode === 'wait-game') {
    if (cfg.autoBreak) { beginBrk(); }
    else { st.mode = 'wait-brk'; st.timeLeft = cfg.brkMin * 60; render(); }
  }
}

function handleSkip() {
  if (transitionTid !== null) return;
  initAudio();
  showConfirm('⏭', '다음 단계로 넘어갈까요?', '남은 시간은 무시됩니다', '이동', executeSkip);
}

function executeSkip() {
  clearAlarm();
  clearInterval(st.tid); st.running = false;
  if (st.mode === 'game') {
    if (st.period >= cfg.periods) {
      releaseWakeLock();
      st.mode = 'done';
      showEndSummary();
      document.getElementById('end-overlay').classList.add('show');
    } else if (cfg.autoBreak) { beginBrk(); }
    else { st.mode = 'wait-brk'; st.timeLeft = cfg.brkMin * 60; render(); }
  } else if (st.mode === 'brk') {
    if (cfg.autoBreak) { beginGame(st.period + 1); }
    else { st.mode = 'wait-game'; st.timeLeft = cfg.gameMin * 60; render(); }
  } else if (st.mode === 'wait-brk') {
    if (cfg.autoBreak) { beginGame(st.period + 1); }
    else { st.mode = 'wait-game'; st.timeLeft = cfg.gameMin * 60; render(); }
  } else if (st.mode === 'wait-game') {
    beginGame(st.period + 1);
  }
}

let confirmCallback = null;

function showConfirm(icon, title, sub, okLabel, cb) {
  if (st.running) { clearInterval(st.tid); st.running = false; render(); }
  confirmCallback = cb;
  document.getElementById('confirm-icon-el').textContent  = icon;
  document.getElementById('confirm-title-el').textContent = title;
  document.getElementById('confirm-sub-el').textContent   = sub;
  document.getElementById('confirm-ok-btn').textContent   = okLabel;
  document.getElementById('confirm-overlay').classList.add('show');
}

function closeConfirm() {
  confirmCallback = null;
  document.getElementById('confirm-overlay').classList.remove('show');
}

function doConfirm() {
  document.getElementById('confirm-overlay').classList.remove('show');
  const cb = confirmCallback; confirmCallback = null;
  if (cb) cb();
}

function handleReset() {
  if (st.mode === 'idle') return;
  showConfirm('↺', '초기화 하시겠습니까?', '진행 중인 경기가 모두 초기화됩니다', '확인', doReset);
}

function doReset() {
  clearAlarm();
  clearInterval(st.tid);
  clearTimeout(transitionTid); transitionTid = null;
  releaseWakeLock();
  st = { mode: 'idle', period: 1, timeLeft: cfg.gameMin * 60, running: false, tid: null, alarmPending: false };
  matchStartTime = 0;
  document.getElementById('end-overlay').classList.remove('show');
  render();
}

function resetAll() { doReset(); }

function backFromEnd() {
  clearAlarm();
  document.getElementById('end-overlay').classList.remove('show');
  st.mode = 'game';
  st.period = cfg.periods;
  st.timeLeft = cfg.gameMin * 60;
  st.running = false;
  render();
}

// ── Settings ──────────────────────────────────────────────
let wasRunningBeforeSettings = false;

function openSettings() {
  wasRunningBeforeSettings = st.running;
  if (st.running) { clearInterval(st.tid); st.running = false; render(); }
  document.getElementById('val-game').textContent      = cfg.gameMin;
  document.getElementById('val-brk').textContent       = cfg.brkMin;
  document.getElementById('val-periods').textContent   = cfg.periods;
  document.getElementById('toggle-auto').checked       = cfg.autoBreak;
  document.getElementById('toggle-sound').checked      = cfg.soundOn;
  document.getElementById('toggle-vibration').checked  = cfg.vibrationOn;
  document.getElementById('settings-backdrop').classList.add('open');
  document.getElementById('settings-sheet').classList.add('open');
}

function testSound() {
  initAudio();
  beepRaw(880, .22, 1,   'square',   0);
  beepRaw(880, .22, 1,   'square',   .35);
  beepRaw(660, .85, 1,   'sawtooth', .70);
}

// ── Focus mode (풀스크린 큰 숫자, 방향 고정) ──────────────────
// 크롬 계열 안드로이드 브라우저에서만 강제 회전이 확실히 동작함.
// iOS Safari 등 미지원 브라우저에서는 풀스크린 큰 숫자만 적용되고
// 회전은 사용자가 직접 기기를 돌려야 함 (조용히 무시되도록 처리).
let focusHideTimer = null;

function enterFocusMode() {
  document.body.classList.add('focus-mode');
  const el = document.documentElement;
  const req = el.requestFullscreen ? el.requestFullscreen() : Promise.resolve();
  req.then(() => {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
  }).catch(() => {});
  peekControls();
}

function exitFocusMode() {
  document.body.classList.remove('focus-mode');
  if (screen.orientation && screen.orientation.unlock) {
    try { screen.orientation.unlock(); } catch (e) {}
  }
  if (document.fullscreenElement) {
    document.exitFullscreen().catch(() => {});
  }
  clearTimeout(focusHideTimer);
  document.querySelector('.bottom-bar').classList.remove('peek');
}

function handleFocusTap() {
  peekControls();
}

function toggleFocusMode() {
  if (document.body.classList.contains('focus-mode')) exitFocusMode();
  else enterFocusMode();
}

function peekControls() {
  const bar = document.querySelector('.bottom-bar');
  bar.classList.add('peek');
  clearTimeout(focusHideTimer);
  focusHideTimer = setTimeout(() => bar.classList.remove('peek'), 3000);
}

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) document.body.classList.remove('focus-mode');
});

function closeSettings() {
  cfg.gameMin     = parseInt(document.getElementById('val-game').textContent);
  cfg.brkMin      = parseInt(document.getElementById('val-brk').textContent);
  cfg.periods     = parseInt(document.getElementById('val-periods').textContent);
  cfg.autoBreak   = document.getElementById('toggle-auto').checked;
  cfg.soundOn     = document.getElementById('toggle-sound').checked;
  cfg.vibrationOn = document.getElementById('toggle-vibration').checked;
  saveCfg();
  if (st.mode === 'idle') st.timeLeft = cfg.gameMin * 60;
  document.getElementById('settings-backdrop').classList.remove('open');
  document.getElementById('settings-sheet').classList.remove('open');
  if (wasRunningBeforeSettings) {
    wasRunningBeforeSettings = false;
    st.running = true;
    startTick();
  }
  render();
}

function adj(key, delta) {
  const map = { game: 'gameMin', brk: 'brkMin', periods: 'periods' };
  cfg[map[key]] = Math.max(1, cfg[map[key]] + delta);
  document.getElementById('val-' + key).textContent = cfg[map[key]];
}

function applySettings() {
  closeSettings();
}

// ── Wake Lock ─────────────────────────────────────────────
let wakeLock = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && st.running) requestWakeLock();
});

// ── Boot ──────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
loadCfg();
st.timeLeft = cfg.gameMin * 60;
render();
</script>
